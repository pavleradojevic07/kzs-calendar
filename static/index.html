<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10203a">
<title>Portorož basketball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10203a;--bg:#e9edf3;--line:#c9d1dd;--mut:#566478;--home:#1f8a4c;--away:#1c4e9e;--unk:#6b7585;--yel:#ffd23f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
header{background:var(--ink);color:#fff;padding:12px max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font:700 26px 'Barlow Condensed',sans-serif;margin:0}small{color:#a9b9d0}
button,a.btn{font:inherit;border:0;border-radius:10px;padding:11px 15px;background:var(--home);color:#fff;font-weight:700;text-decoration:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
button.alt,a.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line)}button:disabled{opacity:.6}
main{max-width:1000px;margin:0 auto;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left))}
.box{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.box h2{margin:0 0 4px;font:700 20px 'Barlow Condensed',system-ui,sans-serif}.hl{border-color:#e0a800;background:#fff8e1}
li{margin:4px 0}.old{text-decoration:line-through;color:var(--mut)}.m{color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:8px 14px;border-radius:99px;background:#fff;border:2px solid var(--line);font-weight:600;font-size:14px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;touch-action:manipulation}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px;align-items:center;font-weight:600}
.sw{display:inline-block;padding:2px 8px;border-radius:6px;color:#fff;margin-right:4px}
.nav{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0}
.nav h2{flex:1;text-align:center;margin:0;font:700 30px 'Barlow Condensed',system-ui,sans-serif}
.nav button{font-size:22px;padding:8px 18px}
#gw{overflow-x:auto;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.big .grid{min-width:780px}
.dow{font:700 15px 'Barlow Condensed',system-ui,sans-serif;text-transform:uppercase;text-align:center;color:var(--mut);padding:4px 0}
.c{border:1px solid var(--line);border-radius:8px;background:#fafbfd;padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:96px}
.big .c{min-height:170px}.c.blank{background:none;border:0}.c.we{background:#f1f4f9}
.n{font:700 15px 'Barlow Condensed',system-ui,sans-serif;color:var(--mut);padding:0 3px}.c.today{border:3px solid var(--ink)}.c.today .n{color:var(--ink)}
.gs{flex:1;display:flex;flex-direction:column;gap:3px}
.b{flex:none;border-radius:6px;color:#fff;padding:5px 6px;font-size:12px;line-height:1.3;position:relative;cursor:pointer;min-width:0}
.b.H{background:var(--home)}.b.A{background:var(--away)}.b.X{background:var(--unk)}
.r1{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.pill{display:inline-block;font:700 12px 'Barlow Condensed',system-ui,sans-serif;letter-spacing:.6px;padding:1px 7px;border-radius:4px;margin:2px 0}
.pill.S{background:#fff;color:var(--ink)}.pill.U{background:var(--yel);color:#10203a}
.op{font-weight:800;font-size:14px;word-break:break-word}
.det{margin-top:2px;font-size:11.5px;opacity:.95}.fit .det{display:none}
.sc{font-weight:800;margin-top:2px}
.b.new{box-shadow:0 0 0 3px var(--yel),0 0 0 5px var(--ink)}
.ag{display:flex;gap:10px;background:#fff;border:2px solid var(--line);border-left:10px solid;border-radius:10px;padding:8px 10px;margin:6px 0;cursor:pointer}
.ag.H{border-left-color:var(--home)}.ag.A{border-left-color:var(--away)}.ag.X{border-left-color:var(--unk)}
.ag .d{min-width:54px;text-align:center;font:700 14px 'Barlow Condensed',system-ui,sans-serif;color:var(--mut);text-transform:uppercase}.ag .d b{display:block;font-size:30px;color:var(--ink);line-height:1}
.ag .pill{margin-right:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--ink);border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:none;z-index:9;box-shadow:0 -6px 20px #0004;max-height:80vh;overflow-y:auto;font-size:17px;max-width:700px;margin:0 auto}
#back{position:fixed;inset:0;background:#0007;display:none;z-index:8}
.sg{padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px}#sheet .x{width:100%;margin-top:10px}
#sheet h3{font:700 24px 'Barlow Condensed',system-ui,sans-serif;margin:0}
#toast{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top));background:var(--ink);color:#fff;padding:12px;border-radius:10px;display:none;z-index:10}
.exp{display:flex;gap:8px;flex-wrap:wrap}
.compact .grid{min-width:0;gap:3px}
.compact .c{min-height:56px;padding:4px 2px;align-items:center;gap:4px}
.compact .c.hasg{background:#fff;border-color:#8fa3c0;cursor:pointer}
.compact .n{font-size:16px;padding:0}.compact .dow{font-size:13px}.compact .c.today{border-width:2px}
.dots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%}.dot.H{background:var(--home)}.dot.A{background:var(--away)}.dot.X{background:var(--unk)}
.dot.U{box-shadow:0 0 0 2px var(--yel)}.dot.new{outline:2px solid var(--ink);outline-offset:2px}
.ag{align-items:center;padding:10px 12px;gap:12px}.agb{min-width:0;flex:1}
.op2{font-weight:800;font-size:17px;word-break:break-word}.l2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0}.tm{font-weight:700}
.ag:active,.b:active,.c.hasg:active{filter:brightness(.94)}
@media (max-width:700px){
 h1{font-size:24px}#go{padding:10px 12px;font-size:15px}
 .nav h2{font-size:26px}.nav button{padding:8px 0;min-width:56px;font-size:24px}
 .leg{font-size:13px;gap:6px 12px}.box{padding:10px}.ag .d{min-width:46px}
 .exp{flex-direction:column}.exp .btn,.exp button{width:100%}
}
</style></head><body>
<header><div><h1>Portorož basketball</h1><small id="last">Not refreshed yet</small></div><button id="go">Check for updates</button></header>
<div id="toast"></div>
<main>
<div id="changes" class="box" hidden></div>
<div id="check" class="box" hidden></div>
<div class="chips" id="chips"></div>
<div class="leg"><span class="sw" style="background:var(--home)">🏠 HOME</span><span class="sw" style="background:var(--away)">✈️ AWAY</span><span><span class="pill S" style="border:1px solid var(--ink)">ČLANI</span> senior</span><span><span class="pill U">U20</span> youth</span></div>
<div class="nav"><button class="alt" id="prev">‹</button><h2 id="mon"></h2><button class="alt" id="next">›</button></div>
<div class="chips"><span class="chip" id="today">Today</span><span class="chip" id="zoom"></span></div>
<div id="gw"></div>
<div id="stat" class="m" style="margin:12px 2px 2px;font-weight:700"></div>
<div id="ag"></div>
<div class="exp" style="margin-top:14px"><a class="btn alt" href="/calendar.ics">Add to phone calendar (.ics)</a><button class="alt" id="png">Save image (this month)</button><button class="alt" id="pdf">Save PDF (all months)</button></div>
<div class="m" id="tip" style="margin-top:8px">Tip: turn the phone sideways to see the whole week at once.</div>
</main>
<div id="back"></div>
<div id="sheet"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date(),today=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
const SUMMER=m=>m===7||m===8;
let cur={y:now.getFullYear(),m:now.getMonth()};if(SUMMER(cur.m))cur.m=9;
let S={games:[]},F={team:'all',ha:'all'},big=true;
const mq=matchMedia('(max-width:700px)');let exporting=false;const compact=()=>mq.matches&&!exporting;
const tName=t=>t==='Senior'?'ČLANI':'U20',tCls=t=>t==='Senior'?'S':'U';
const short=o=>(o||'').replace(/^(KK|ŽKK|KD|ŠD|BK)\s+/i,'');
const ic=g=>g.ha==='H'?'🏠':g.ha==='A'?'✈️':'❔',hn=g=>g.ha==='H'?'HOME':g.ha==='A'?'AWAY':'?';
const dfmt=(d,t)=>new Date(d+'T00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(t?' · '+t:'');
function result(g){if(!g.score||!g.ha)return null;const[a,b]=g.score.split(':').map(Number);const u=g.ha==='H'?a:b,t=g.ha==='H'?b:a;return u>t?'W':u<t?'L':'D'}
const hall=g=>g.hall||'';
const compLine=g=>[g.comp,g.round?g.round+'. kolo':''].filter(Boolean).join(' • ');
const nm=n=>/portoro[žz]/i.test(n)?`<b>${esc(n)}</b>`:esc(n);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',5000)}
function newKeys(){const c=S.last_changes;if(!c||c.first_run)return new Set();return new Set([...c.added.map(g=>g.key),...c.changed.map(x=>x.game.key)])}
function renderChanges(){
  const c=S.last_changes,box=$('changes');if(!c){box.hidden=true;return}
  box.hidden=false;const n=c.added.length+c.removed.length+c.changed.length;box.className='box'+(n&&!c.first_run?' hl':'');
  let h=`<h2>${c.first_run?'First load':n?'What changed':'No changes'}</h2>`;
  if(c.first_run)h+=`${c.added.length} games loaded.`;else if(!n)h+='Nothing new since the previous check.';
  else{h+='<ul>';
    c.added.forEach(g=>h+=`<li><b>New:</b> ${tName(g.team)} – ${esc(g.title)}, ${dfmt(g.date,g.time)}</li>`);
    c.removed.forEach(g=>h+=`<li><b>Removed:</b> ${tName(g.team)} – ${esc(g.title)}, ${dfmt(g.date)}</li>`);
    c.changed.forEach(x=>h+=`<li><b>${tName(x.game.team)} – ${esc(x.game.title)}:</b> `+Object.entries(x.changes).map(([f,[a,b]])=>`${f} <span class="old">${esc(a||'–')}</span> → ${esc(b||'–')}`).join('; ')+'</li>');h+='</ul>'}
  if(c.errors&&c.errors.length)h+=`<div class="m">Could not load: ${esc(c.errors.join('; '))}</div>`;box.innerHTML=h}
function chips(){
  const o=[['team','all','All teams'],['team','Senior','Člani'],['team','U20','U20'],['ha','all','Home + away'],['ha','H','🏠 Home'],['ha','A','✈️ Away']];
  $('chips').innerHTML=o.map(([k,v,l])=>`<span class="chip ${F[k]===v?'on':''}" data-k="${k}" data-v="${v}">${l}</span>`).join('');
  document.querySelectorAll('#chips .chip').forEach(e=>e.onclick=()=>{F[e.dataset.k]=e.dataset.v;render()})}
function block(g){const r=result(g);
  return `<div class="b ${g.ha||'X'} ${newKeys().has(g.key)?'new':''}" data-i="${g.i}">
  <div class="op">${ic(g)} ${g.ha==='A'?'@':'vs'} ${esc(short(g.opp))}</div>
  <div><span class="pill ${tCls(g.team)}">${tName(g.team)}</span></div>${g.time?`<div style="font-weight:700">🕐 ${g.time}</div>`:''}
  <div class="det">${g.hall?`<div>${esc(g.hall)}</div>`:''}${compLine(g)?`<div>${esc(compLine(g))}</div>`:''}</div>
  ${g.score?`<div class="sc">${r?r+' · ':''}${esc(g.score)}</div>`:''}</div>`}
const dot=g=>`<span class="dot ${g.ha||'X'} ${g.team==='U20'?'U':''} ${newKeys().has(g.key)?'new':''}"></span>`;
function render(){
  const cp=compact();chips();$('zoom').style.display=cp?'none':'';$('tip').style.display=cp?'none':'';$('zoom').textContent=big?'🔍 Big cells (details) ✓':'🔍 Compact cells';
  const all=S.games.map((g,i)=>({...g,i})).filter(g=>(F.team==='all'||g.team===F.team)&&(F.ha==='all'||g.ha===F.ha));
  const{y,m}=cur,start=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),pre=`${y}-${pad(m+1)}-`;
  $('mon').textContent=new Date(y,m,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  let c='';for(let i=0;i<start;i++)c+='<div class="c blank"></div>';
  for(let d=1;d<=n;d++){const k=pre+pad(d),gs=all.filter(g=>g.date===k),wd=(start+d-1)%7;
    c+=`<div class="c ${wd>4?'we':''} ${k===today?'today':''} ${cp&&gs.length?'hasg':''}" ${cp&&gs.length?`data-d="${k}"`:''}><span class="n">${d}</span>${gs.length?(cp?`<div class="dots">${gs.map(dot).join('')}</div>`:`<div class="gs">${gs.map(block).join('')}</div>`):''}</div>`}
  $('gw').className=cp?'compact':big?'big':'fit';
  $('gw').innerHTML=`<div class="grid" id="grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}${c}</div>`;
  const mg=all.filter(g=>g.date.startsWith(pre)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  $('stat').textContent=`${mg.length} game${mg.length===1?'':'s'} this month · ${mg.filter(g=>g.ha==='H').length} home · ${mg.filter(g=>g.ha==='A').length} away`;
  $('ag').innerHTML=mg.map(g=>`<div class="ag ${g.ha||'X'}" data-i="${g.i}"><div class="d">${new Date(g.date+'T00:00').toLocaleDateString('en-GB',{weekday:'short'})}<b>${+g.date.slice(8)}</b></div><div class="agb"><div class="op2">${ic(g)} ${g.ha==='A'?'@':'vs'} ${esc(short(g.opp))}</div><div class="l2"><span class="pill ${tCls(g.team)}" style="border:1px solid #10203a55">${tName(g.team)}</span>${g.time?`<span class="tm">🕐 ${g.time}</span>`:''}${g.score?`<b>${result(g)||''} ${esc(g.score)}</b>`:''}</div><div class="m">${[hall(g),compLine(g)].filter(Boolean).map(esc).join(' · ')}</div></div></div>`).join('')||'<div class="m">No games this month.</div>';
  document.querySelectorAll('.b,.ag').forEach(e=>e.onclick=()=>sheet([S.games[e.dataset.i]]));
  document.querySelectorAll('.c.hasg').forEach(e=>e.onclick=()=>sheet(all.filter(g=>g.date===e.dataset.d)))}
function closeSheet(){$('sheet').style.display='none';$('back').style.display='none'}
function sheet(gs){const s=$('sheet');
  s.innerHTML=gs.map(g=>{const r=result(g);return `<div class="sg"><h3>${ic(g)} ${nm(g.home)} – ${nm(g.away)}</h3><div><span class="pill ${tCls(g.team)}" style="border:1px solid #10203a55">${tName(g.team)}</span> <b>${g.ha==='H'?'HOME game':'AWAY game'}</b>${r?` · <b>${{W:'Win',L:'Loss',D:'Draw'}[r]} ${esc(g.score)}</b>`:''}</div><div>${dfmt(g.date,g.time)}</div>${g.hall?`<div>🏟 ${esc(g.hall)}</div>`:''}${compLine(g)?`<div>🏆 ${esc(compLine(g))}</div>`:''}</div>`}).join('')+`<div class="m">Home team is listed first.</div><button class="alt x" onclick="closeSheet()">Close</button>`;
  s.scrollTop=0;s.style.display='block';$('back').style.display='block'}
$('back').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function renderCheck(){const b=$('check'),c=S.checks||{},is=S.issues||{},ts=Object.keys(c);if(!ts.length){b.hidden=true;return}
  b.hidden=false;let h='<h2>Data check</h2><div class="m" style="margin-bottom:6px">Games are always read from kzs.si. The reference file is only a comparison, so differences below are usually changes made by the league.</div>';
  ts.forEach(t=>{const k=c[t];h+=`<div style="margin-bottom:6px"><b>${tName(t)}</b>: ${k.count} games read (${k.home} home, ${k.away} away)`;
    if(k.reference!==undefined){const d=[...k.missing.map(x=>'not on the site: '+x),...k.differences,...k.extra.map(x=>'only on the site: '+x)],pa=(k.past||[]).length;
      h+=`<br>${d.length?'ℹ️':'✅'} Compared with your reference file: ${k.matched} of ${k.reference} identical`+(pa?`, ${pa} already played (no longer on the site's schedule)`:'')+(d.length?', the rest changed on the site:':'');
      d.slice(0,15).forEach(x=>h+=`<div class="m">• ${esc(x)}</div>`)}
    (is[t]||[]).slice(0,10).forEach(x=>h+=`<div class="m">⚠️ skipped: ${esc(x)}</div>`);h+='</div>'});
  b.innerHTML=h}
function step(d){let{y,m}=cur;do{m+=d;if(m>11){m=0;y++}if(m<0){m=11;y--}}while(SUMMER(m));cur={y,m};render()}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('today').onclick=()=>{cur={y:now.getFullYear(),m:SUMMER(now.getMonth())?9:now.getMonth()};render()};
$('zoom').onclick=()=>{big=!big;render()};
function load(s){S=s;$('last').textContent=s.last_refresh?'Updated '+new Date(s.last_refresh).toLocaleString('en-GB'):'Not refreshed yet';
  const hasCur=s.games.some(g=>g.date.startsWith(`${cur.y}-${pad(cur.m+1)}`));
  if(s.games.length&&!hasCur){const up=s.games.filter(g=>g.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0]||[...s.games].sort((a,b)=>b.date.localeCompare(a.date))[0];cur={y:+up.date.slice(0,4),m:+up.date.slice(5,7)-1}}
  renderChanges();renderCheck();render()}
$('go').onclick=async()=>{
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  const b=$('go');b.disabled=true;b.textContent='Checking…';
  try{const r=await fetch('/api/refresh',{method:'POST'});const s=await r.json();if(s.error)throw new Error(s.error);load(s);
    const c=s.last_changes,n=c.added.length+c.removed.length+c.changed.length;
    const msg=c.first_run?`${c.added.length} games loaded`:n?`${n} update${n>1?'s':''} found`:'No changes';
    toast(msg);if(n&&!c.first_run&&window.Notification&&Notification.permission==='granted')new Notification('Portorož basketball',{body:msg});
  }catch(e){toast('Update failed: '+e.message)}
  b.disabled=false;b.textContent='Check for updates'};
const shot=()=>html2canvas($('grid'),{backgroundColor:'#ffffff',scale:mq.matches?1.5:2,windowWidth:1100,onclone:d=>{d.getElementById('gw').style.overflow='visible'}});
$('png').onclick=async()=>{toast('Preparing image…');const wasBig=big;exporting=true;big=true;render();
  try{const c=await shot(),a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`portoroz-${cur.y}-${pad(cur.m+1)}.png`;a.click()}
  catch(e){toast('Could not save image: '+e.message)}finally{exporting=false;big=wasBig;render()}};
$('pdf').onclick=async()=>{toast('Preparing PDF…');const{jsPDF}=window.jspdf,p=new jsPDF('l','mm','a4'),keep={...cur},wasBig=big;exporting=true;big=true;
  try{const st=cur.m>=9?cur.y:cur.y-1,list=[[st,9],[st,10],[st,11],...[0,1,2,3,4,5,6].map(m=>[st+1,m])];
    for(let i=0;i<list.length;i++){cur={y:list[i][0],m:list[i][1]};render();const c=await shot(),mw=277,mh=185,k=Math.min(mw/c.width,mh/c.height);
      if(i)p.addPage();p.setFontSize(14);p.text(`Portorož basketball – ${$('mon').textContent}`,10,10);p.addImage(c.toDataURL('image/png'),'PNG',10,14,c.width*k,c.height*k)}
    p.save('portoroz-basketball-season.pdf')}
  catch(e){toast('Could not save PDF: '+e.message)}finally{cur=keep;big=wasBig;exporting=false;render()}};
if(mq.addEventListener)mq.addEventListener('change',render);else mq.addListener(render);
fetch('/api/games').then(r=>r.json()).then(load);
</script></body></html>
